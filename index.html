<!DOCTYPE html>
<html>
<head>
    <title>Chat Médico</title>
    <style>
        body {
            font-family: Arial;
            max-width: 800px;
            margin: 30px auto;
        }

        #chat {
            border: 1px solid #ccc;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 10px;
        }

        .user {
            text-align: right;
            margin: 10px;
        }

        .bot {
            text-align: left;
            margin: 10px;
        }

        input {
            width: 80%;
            padding: 10px;
        }

        button {
            padding: 10px;
        }
    </style>
</head>
<body>

    <h2>Chat Médico</h2>

    <div id="chat"></div>

    <input
        type="text"
        id="message"
        placeholder="Describe tus síntomas..."
    >

    <button onclick="sendMessage()">
        Enviar
    </button>

    <script>

        window.onload = () => {

        const chat = document.getElementById("chat");

        chat.innerHTML += `
            <div class="bot">
                <b>SITEC:</b>
                Hola, soy SITEC. ¿En qué puedo ayudarte hoy?
            </div>
        `;
    };

    document.getElementById("message").addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    });



        async function sendMessage() {

            const input = document.getElementById("message");
            const text = input.value;

            if (!text) return;

            const chat = document.getElementById("chat");

            chat.innerHTML += `
                <div class="user">
                    <b>Tú:</b> ${text}
                </div>
            `;

            input.value = "";

            const loadingId = "loading-message";

            chat.innerHTML += `
                <div class="bot" id="${loadingId}">
                     <b>SITEC:</b> escribiendo...
                </div>
            `;

            const response = await fetch(
                "/chat",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: text
                    })
                }
            );

            const data = await response.json();

            chat.innerHTML += `
                <div class="bot">
                    <b>SITEC:</b> ${data.response}
                </div>
            `;

            chat.scrollTop = chat.scrollHeight;
        }

    </script>

</body>
</html>
